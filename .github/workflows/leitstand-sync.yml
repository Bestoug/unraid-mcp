name: Leitstand-Sync-Image

on:
  push:
    branches: [main]
    paths: ["leitstand-sync/**", ".github/workflows/leitstand-sync.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skript-Test
        run: python3 -c "import ast,sys;ast.parse(open('leitstand-sync/leitstand_daten.py').read())" && sh -n leitstand-sync/sync.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: leitstand-sync
          push: true
          tags: |
            ghcr.io/bestoug/leitstand-sync:latest
            ghcr.io/bestoug/leitstand-sync:${{ github.sha }}
