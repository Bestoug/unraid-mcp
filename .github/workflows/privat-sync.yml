name: Privat-Sync-Image

on:
  push:
    branches: [main]
    paths: ["privat-sync/**", ".github/workflows/privat-sync.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skript-Test
        run: python3 -m unittest discover -s privat-sync/tests && sh -n privat-sync/sync.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: privat-sync
          push: true
          tags: |
            ghcr.io/bestoug/privat-sync:latest
            ghcr.io/bestoug/privat-sync:${{ github.sha }}
