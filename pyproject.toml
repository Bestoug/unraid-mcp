[project]
name = "unraid-mcp"
version = "0.2.1"
description = "Unraid-Server als MCP-Server für Claude (Status, Container, Arbeitsordner)"
requires-python = ">=3.12"
dependencies = [
  "fastmcp>=2.13",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
unraid-mcp = "unraid_mcp.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
